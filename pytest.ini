[pytest]
pythonpath = .
testpaths = tests
markers =
    integration: требуют внешних сервисов (RUN_INTEGRATION=1): реальные iTunes/RSS, PostgreSQL, MinIO
    system: системные тесты (производительность, отказоустойчивость)
addopts = -ra -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=70
